name: clearbox_delivery
repository: https://github.com/yourorg/clearbox-delivery

packages:
  - apps/*
  - packages/*
  - '!**/build/**'
  - '!**/.dart_tool/**'

bootstrap:
  runPubGetInParallel: true
  enforceLockstepSdk: false   # 禁止自動修改子 package SDK 約束

scripts:
  analyze:
    run: melos exec -c 1 -- flutter analyze
    description: Run Flutter analyze for all packages

  format:
    run: melos exec -c 1 -- dart format --set-exit-if-changed .
    description: Run Dart formatter on all packages

  test:
    run: melos exec -c 1 --fail-fast -- flutter test --no-pub --coverage
    description: Run Flutter tests for all packages

  "test:unit":
    run: flutter test tests/unit
    description: Run unit tests
    exec:
      concurrency: 1

  "test:integration":
    run: flutter test tests/integration
    description: Run integration tests
    exec:
      concurrency: 1

  clean:
    run: melos exec -c 1 -- flutter clean
    description: Clean all packages

  get:
    run: melos exec -c 1 -- flutter pub get
    description: Get dependencies for all packages

  "build:runner":
    run: melos exec -c 1 --scope="core_data,customer_app" -- dart run build_runner build --delete-conflicting-outputs
    description: Run build_runner only for packages that use code generation

  test:flutter:
    run: melos exec --flutter --dir-exists="test" -c 1 -- flutter test --no-pub --coverage
    description: Run Flutter tests in Flutter packages that contain a test/ folder

  test:dart:
    run: melos exec --no-flutter --dir-exists="test" -c 1 -- dart test
    description: Run Dart tests in non-Flutter packages that contain a test/ folder

