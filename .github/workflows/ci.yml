name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  FLUTTER_VERSION: '3.24.x'
  DENO_VERSION: 'v1.x'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Supabase CLI（官方 Action）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deno（給 seed scripts / Edge functions 用）
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # Flutter + Dart
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Node.js（Newman 用）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # psql client（給後面手動跑 seed 的 SQL）
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 啟動本地 Supabase（Kong/API/Auth/DB…）
      - name: Start Supabase
        run: supabase start

      # Reset + Migrate + Seed（DB 走 54322）
      - name: Reset & Seed Database
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -e
          cd infra
          # 讀本地設定與 migrations，重建資料庫
          supabase db reset --local
          # 基礎 seed（SQL）
          psql "$DB_URL" < supabase/seed/01_base.sql
          # 動態 seed（Deno）
          deno run -A supabase/seed/seed_dynamic.ts
          cd ..

      # Melos
      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: melos bootstrap

      - name: Generate code (build_runner)
        run: melos run build:runner

      # Unit Tests
      - name: Run Dart/Flutter Unit Tests
        run: |
          set -e
          cd packages/geo_h3
          flutter test
          cd ../domain
          flutter test
          cd ../../tests/unit
          dart test
          cd ../..

      # Integration Tests（需要 SUPABASE_URL/ANON_KEY）
      - name: Run Integration Tests
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          set -e
          cd tests/integration
          dart test
          cd ../..

      # API 測試（Newman）
      - name: Install Newman
        run: npm install -g newman

      - name: Make newman script executable
        run: chmod +x scripts/run_newman.sh

      - name: Run API Tests (Newman)
        env:
          BASE_URL: http://127.0.0.1:54321
          ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: scripts/run_newman.sh

      # （可選）簡單跑一個 E2E，失敗不擋住流程
      - name: Run E2E Tests (merchant_app)
        continue-on-error: true
        run: |
          flutter config --enable-web
          cd apps/merchant_app
          flutter test integration_test/

      # 上傳報告 / 產出物
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            tests/api/newman-report.xml
            coverage/
            test-results/

      # Lints / Analyze
      - name: Run Flutter Analyze
        run: melos run analyze

  build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        app: [customer_app, merchant_app, courier_app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: melos bootstrap

      - name: Build ${{ matrix.app }} (Android)
        run: |
          set -e
          cd apps/${{ matrix.app }}
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
