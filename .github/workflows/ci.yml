name: CI Pipeline

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

env:
  FLUTTER_VERSION: "3.22.2"
  DENO_VERSION: "v1.x"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Supabase CLI（官方 Action）
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deno（給 seed scripts / Edge functions 用）
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.3"

      - name: Check Deno version
        run: deno --version

      # Flutter + Dart
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Node.js（Newman 用；不設 cache 以避免 lockfile 警告）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # psql client（給手動跑 seed 的 SQL）
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # 啟動本地 Supabase（Kong/API/Auth/DB…）— 一定要在 infra/ 底下跑
      - name: Start Supabase (local stack)
        working-directory: infra
        run: supabase start

      # Reset + Migrate + Seed（DB 走 54322）— 同樣在 infra/ 底下
      - name: Reset & Seed Database
        working-directory: infra
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -e
          supabase db reset --local --no-seed
          psql "$DB_URL" < supabase/seed/01_base.sql
          deno run -A --no-lock supabase/seed/seed_dynamic.ts
          cd ..

      # Melos
      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: melos bootstrap

      - name: Generate code (build_runner)
        run: melos run build:runner

      - name: Run Dart/Flutter Unit Tests
        run: |
          set -e
          melos exec -c 1 --scope="supabase_client" -- flutter test

      # Integration Tests（需要 SUPABASE_URL/ANON_KEY）
      - name: Run Integration Tests
        continue-on-error: true
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          echo "Skipping integration tests (no tests/integration folder yet)"

      # API 測試（Newman）
      - name: Install Newman
        run: npm install -g newman

      - name: Make newman script executable
        run: chmod +x scripts/run_newman.sh

      - name: Run API Tests (Newman)
        env:
          BASE_URL: http://127.0.0.1:54321
          ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: scripts/run_newman.sh

      # （可選）簡單跑一個 E2E，失敗不擋住流程
      - name: Run E2E Tests (merchant_app)
        continue-on-error: true
        run: |
          flutter config --enable-web
          cd apps/merchant_app
          flutter test integration_test/

      # 上傳報告 / 產出物（若沒檔案不要失敗）
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            tests/api/newman-report.xml
            coverage/
            test-results/
          if-no-files-found: ignore

      # Lints / Analyze
      - name: Run Flutter Analyze
        run: melos run analyze

  build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        app: [customer_app, merchant_app, courier_app]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: melos bootstrap

      - name: Build ${{ matrix.app }} (Android)
        run: |
          set -e
          cd apps/${{ matrix.app }}
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Stop Supabase (always)
        if: always()
        working-directory: infra
        run: supabase stop
